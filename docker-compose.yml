services:

  backend:

    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_started

      rabbitmq:
        condition: service_started

    restart: unless-stopped

  postgres:

    image: postgres:17

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  redis:

    image: redis:8

    ports:
      - "6379:6379"

    restart: unless-stopped

  rabbitmq:

    image: rabbitmq:4-management

    container_name: task-management-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    restart: unless-stopped

volumes:
  postgres_data: